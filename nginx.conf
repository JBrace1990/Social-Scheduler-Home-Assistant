server {
    listen 3939;
    server_name _;

    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;

    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Rewrite static paths and API references for HA's per-install ingress token.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html text/css application/javascript;
        sub_filter_once off;
        sub_filter '/_next/' '$http_x_ingress_path/_next/';
        sub_filter '"/api/' '"$http_x_ingress_path/api/';
        sub_filter '\\"/api/' '\\"$http_x_ingress_path/api/';
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter 'src="/' 'src="$http_x_ingress_path/';
        sub_filter '</head>' '<script>(function(){var b="$http_x_ingress_path";if(!b)return;function p(u){if(typeof u!=="string")return u;try{var v=new URL(u,location.href);if(v.origin===location.origin&&v.pathname.charAt(0)==="/"&&v.pathname!==b&&v.pathname.indexOf(b+"/")!==0){v.pathname=b+v.pathname;return v.href}}catch(e){}return u}var f=window.fetch;window.fetch=function(i,o){if(typeof i==="string")i=p(i);else if(i instanceof Request)i=new Request(p(i.url),i);return f.call(this,i,o)};var x=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){arguments[1]=p(u);return x.apply(this,arguments)}})();</script></head>';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
