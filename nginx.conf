server {
    listen 3939;
    server_name _;

    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;

    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Next.js emits root-relative /_next asset URLs. Home Assistant serves
        # this app under a per-install ingress token, so prefix those references
        # with the path supplied on every ingress request.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html text/css application/javascript;
        sub_filter_once off;
        sub_filter '/_next/' '$http_x_ingress_path/_next/';
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter 'src="/' 'src="$http_x_ingress_path/';
        sub_filter '</head>' '<script>(function(){var b="$http_x_ingress_path";if(!b)return;function p(u){if(typeof u!=="string")return u;try{var v=new URL(u,location.href);if(v.origin===location.origin&&v.pathname.charAt(0)==="/"&&v.pathname!==b&&v.pathname.indexOf(b+"/")!==0){v.pathname=b+v.pathname;return v.href}}catch(e){}return u}var f=window.fetch;window.fetch=function(i,o){if(typeof i==="string")i=p(i);else if(i instanceof Request)i=new Request(p(i.url),i);return f.call(this,i,o)};var x=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){arguments[1]=p(u);return x.apply(this,arguments)};["pushState","replaceState"].forEach(function(k){var q=history[k];history[k]=function(s,t,u){return q.call(this,s,t,p(u))}});function fix(n){if(!n||n.nodeType!==1)return;["href","src","poster"].forEach(function(k){var v=n.getAttribute(k);if(v&&v.charAt(0)==="/")n.setAttribute(k,p(v))});if(n.querySelectorAll)n.querySelectorAll("[href^=\"/\"],[src^=\"/\"],[poster^=\"/\"]").forEach(fix)}new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==="attributes")fix(m.target);m.addedNodes.forEach(fix)})}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["href","src","poster"]});document.addEventListener("click",function(e){if(e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;var a=e.target.closest&&e.target.closest("a[href]");if(!a||a.target==="_blank"||a.origin!==location.origin||a.pathname.indexOf(b+"/")!==0)return;e.preventDefault();e.stopImmediatePropagation();location.assign(a.href)},true);fix(document.documentElement)})();</script></head>';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
