server {
    listen 3939;
    server_name _;

    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;

    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Next.js emits root-relative /_next asset URLs. Home Assistant serves
        # this app under a per-install ingress token, so prefix those references
        # with the path supplied on every ingress request.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html text/css application/javascript;
        sub_filter_once off;
        sub_filter '/_next/' '$http_x_ingress_path/_next/';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
