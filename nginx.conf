server {
    listen 3939;
    server_name _;

    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;

    allow 172.30.32.2;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Next.js emits root-relative /_next asset URLs. Home Assistant serves
        # this app under a per-install ingress token, so prefix those references
        # with the path supplied on every ingress request.
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/html text/css application/javascript;
        sub_filter_once off;
        sub_filter '/_next/' '$http_x_ingress_path/_next/';
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter '</head>' '<script>(function(){var b="$http_x_ingress_path";if(!b||b==="")return;function p(u){return typeof u==="string"&&u.charAt(0)==="/"&&u.indexOf(b+"/")!==0&&u!==b?b+u:u}var f=window.fetch;window.fetch=function(i,o){if(typeof i==="string")i=p(i);else if(i instanceof Request)i=new Request(p(i.url),i);return f.call(this,i,o)};var x=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){arguments[1]=p(u);return x.apply(this,arguments)};["pushState","replaceState"].forEach(function(k){var q=history[k];history[k]=function(s,t,u){return q.call(this,s,t,p(u))}});function links(n){if(n&&n.nodeType===1){if(n.matches&&n.matches("a[href^=\"/\"]"))n.setAttribute("href",p(n.getAttribute("href")));if(n.querySelectorAll)n.querySelectorAll("a[href^=\"/\"]").forEach(function(a){a.setAttribute("href",p(a.getAttribute("href")))})}}new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==="attributes")links(m.target);m.addedNodes.forEach(links)})}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["href"]});links(document.documentElement)})();</script></head>';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
